<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC Holidays Admin</title>

    <link rel="stylesheet" href="css/admin.css">
</head>

<body>

<div class="login-box">

    <h1>ABC Holidays</h1>

    <h2>Administrator Login</h2>

    <input
        id="email"
        type="email"
        placeholder="Email">

    <input
        id="password"
        type="password"
        placeholder="Password">

    <button id="loginBtn">
        Login
    </button>

    <p id="error"></p>

<div id="dashboard" style="display:none;">

    <div class="sidebar">

        <h2>ABC Holidays</h2>

        <button id="manageHotels">🏨 Hotels</button>

        <button id="managePackages">📦 Packages</button>

        <button id="manageReviews">⭐ Reviews</button>

        <button id="manageHero">🖼 Hero Banner</button>

        <button id="logoutBtn">Logout</button>

    </div>

    <div class="content" id="content">

        <h1>Welcome Admin</h1>

        <p>Select any option from the left menu.</p>

    </div>

</div>
<script type="module" src="js/admin.js"></script>

</body>

</html>
