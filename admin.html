<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC Holidays Admin</title>

    <link rel="stylesheet" href="css/admin.css">
</head>

<body>

<div id="loginPage">

    <div class="login-box">

        <h1>ABC Holidays</h1>

        <h3>Administrator Login</h3>

        <input id="email" type="email" placeholder="Email">

        <input id="password" type="password" placeholder="Password">

        <button id="loginBtn">Login</button>

        <p id="error"></p>

    </div>

</div>


<div id="dashboard" style="display:none;">

    <aside class="sidebar">

        <h2>ABC Holidays</h2>

        <button class="menu active" id="dashboardBtn">
            📊 Dashboard
        </button>

        <button class="menu" id="manageHotels">
            🏨 Hotels
        </button>

        <button class="menu" id="managePackages">
            📦 Packages
        </button>

        <button class="menu" id="manageReviews">
            ⭐ Reviews
        </button>

        <button class="menu" id="manageHero">
            🖼 Hero Banner
        </button>

        <button class="menu" id="manageSettings">
            ⚙ Settings
        </button>

        <button class="logout" id="logoutBtn">
            Logout
        </button>

    </aside>


    <main id="content">

        <h1>Dashboard</h1>

        <div class="cards">

            <div class="card">
                <h2>Hotels</h2>
                <p id="hotelCount">0</p>
            </div>

            <div class="card">
                <h2>Packages</h2>
                <p id="packageCount">0</p>
            </div>

            <div class="card">
                <h2>Reviews</h2>
                <p id="reviewCount">0</p>
            </div>

        </div>

    </main>

</div>

<script type="module" src="js/admin.js"></script>

</body>

</html>
